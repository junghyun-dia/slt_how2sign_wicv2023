# @package _global_
#
# random4000_v3 variant of baseline_6_3_dp03_wd_2.yaml (the paper's best
# i3d model): same architecture / optimizer / schedule, pointed at the
# filtered How2Sign random4000_v3 split (4000 train / 200 val / 300 test
# sentences, minus a handful of sentences missing from the official wicv23
# I3D feature release -- see
# external/prepare_how2sign_for_wicv2023.py's coverage report:
# train 3914/4000 (97.9%), val 198/200 (99.0%), test 298/300 (99.3%)).
#
# task.data / I3D_DIR must point at the filtered manifest dir produced by
# that script:
#   /mnt/aix22303/data/how2sign/How2Sign/prepared/wicv23_random4000_v3
# which contains the filtered
#   cvpr23.fairseq.i3d.{train,val,test}.how2sign.tsv
# (same basenames as the official release -- only the *directory* differs)
# plus symlinks to the shared, unmodified i3d_features/ and vocab/ dirs.
#
# checkpoint.save_dir and bpe.sentencepiece_model still resolve relative to
# ${env:SAVE_DIR}, so SAVE_DIR must ALSO be set (it can be the same
# wicv23_random4000_v3 dir, or any other dir that has its own vocab/
# subdir -- do not reuse the official wicv23/pretrained dir as SAVE_DIR for
# a new training run, to avoid colliding with the released pretrained
# checkpoints there).
#
# NOTE (flagged, not applied): this split is ~8x smaller than the paper's
# full How2Sign train set (3914 vs 30384 sentences). optimization.max_update
# (100_000), lr_scheduler.lr_period_updates (17000) and
# checkpoint.patience (10000) below are copied unchanged from the paper's
# config. With ~8x fewer updates/epoch at the same batch_size/max_tokens,
# reaching max_update will take ~8x as many epochs, and the cosine LR
# restarts (lr_period_updates=17000) and eval/checkpoint cadence
# (validate_interval=2, save_interval=2 epochs) may need re-tuning for this
# smaller dataset. Left unchanged here per instructions; revisit if
# training clearly over/underfits.

hydra:
  run:
    dir: ${env:SAVE_DIR}/${env:WANDB_NAME}/hydra_outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

common:
  seed: 48151623
  fp16: False
  wandb_project: ${env:WANDB_PROJECT}

distributed_training:
  heartbeat_timeout: 600

checkpoint:
  save_dir: ${env:SAVE_DIR}/${env:WANDB_NAME}/ckpts/
  no_epoch_checkpoints: True
  save_interval: 2
  #save_interval_updates: 927*2 #Default is at the end of epoch
  #keep_interval_updates: 1
  best_checkpoint_metric: reduced_sacrebleu
  maximize_best_checkpoint_metric: True
  keep_best_checkpoints: 2
  patience: 10000

dataset:
  train_subset: cvpr23.fairseq.i3d.train.how2sign           # random4000_v3-filtered tsv, same basename as the official split
  valid_subset: cvpr23.fairseq.i3d.val.how2sign              # random4000_v3-filtered tsv, same basename as the official split
  num_workers: 4
  batch_size: 32
  max_tokens: 16_000                          # 640s @ 25fps
  skip_invalid_size_inputs_valid_test: True
  validate_interval: 2

task:
  _name: sign_to_text
  data: ${env:I3D_DIR}                        # set I3D_DIR to the wicv23_random4000_v3 dir
  max_source_positions: 1024
  max_target_positions: 1024
  feats_type: "i3d"
  eval_gen_config:
    beam: 5
  eval_bleu: True
  #eval_bleu_args: '{"beam": 5, "max_len_a": 0, "max_len_b": 30, "lenpen": 1.0}'
  pre_tokenizer: moses #Should we also do a truecaser? Check this when you can
  eval_bleu_config:
    sacrebleu_tokenizer: 13a
    sacrebleu_lowercase: False
    sacrebleu_char_level: False
  eval_chrf: True
  eval_reducedBLEU: True
  eval_reducedchrf: True
  eval_print_samples: True

model:
  _name: sign2text_transformer
  encoder_embed_dim: 256
  encoder_ffn_embed_dim: 1024
  encoder_attention_heads: 4
  encoder_layers: 6
  decoder_embed_dim: 256
  decoder_ffn_embed_dim: 1024
  decoder_attention_heads: 4
  decoder_layers: 3
  decoder_output_dim: 256 #Laia: don't touch this
  layernorm_embedding: True
  share_decoder_input_output_embed: True
  dropout: 0.3
  attention_dropout: 0.3
  activation_dropout: 0.3
  activation_fn: relu

criterion:
  _name: label_smoothed_cross_entropy
  label_smoothing: 0.1

optimizer:
  _name: adam
  adam_betas: (0.9, 0.98)
  adam_eps: 1e-08
  weight_decay: 1e-1

optimization:
  lr: [0.001]
  max_update: 250_000                  # random4000_v3: extended from 100k after the first run showed
                                        # reduced_sacrebleu still improving (0.43->0.50) right up to the
                                        # 100k cap, with long no-improvement plateaus (up to 115 validation
                                        # checks) in between -- patience-based early stop would have cut
                                        # training off far too early (see epoch 68, score 0.31). Resumes
                                        # from checkpoint_last.pt, cosine schedule (period=17000) just
                                        # keeps cycling, no other changes needed.
  update_freq: [1]
  clip_norm: 1

lr_scheduler:
  _name: cosine
  warmup_updates: 2000
  warmup_init_lr: 1e-07
  lr: [0.001]
  min_lr: 1e-4
  t_mult: 1
  lr_period_updates: 17000
  lr_shrink: 1

bpe:
  sentencepiece_model: ${env:SAVE_DIR}/vocab/cvpr23.train.how2sign.unigram7000_lowercased.model
